# Runs the receiver tests on Linux, macOS and Windows, and the Android unit tests.
# NOTE: written but not yet executed by any CI service; the first push will show whether the
# Windows/macOS jobs pass. Tests that need POSIX symlinks or a display skip themselves.
name: CI
on: [push, pull_request]

jobs:
  receiver:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: fedora } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: ./gradlew testDebugUnitTest assembleDebug

  desktop-bundles:
    needs: receiver
    strategy:
      matrix: { os: [macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: fedora } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -e . pyinstaller
      - run: pyinstaller ../packaging/desktop/localbridge.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with: { name: "localbridge-${{ matrix.os }}", path: fedora/dist/* }
