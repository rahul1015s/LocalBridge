[project]
name = "localbridge"
version = "0.1.0"
description = "Secure local-network file transfer between Android and Fedora"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cryptography>=43",
  "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
localbridge = "localbridge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localbridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"localbridge/ui/*" = ["E501"]
"localbridge/app.py" = ["E501"]
"localbridge/storage.py" = ["E501"]
"localbridge/server.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
